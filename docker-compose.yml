services:
  postgres:
    image: postgres:16
    container_name: stella-atlas-postgres
    environment:
      POSTGRES_DB: stella_atlas
      POSTGRES_USER: stella_atlas
      POSTGRES_PASSWORD: stella_atlas
    ports:
      - "5432:5432"
    volumes:
      - stella-atlas-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U star_observer -d stella_atlas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  stella-atlas-postgres-data:
