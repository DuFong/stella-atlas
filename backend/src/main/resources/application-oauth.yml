spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email

stellaatlas:
  security:
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
