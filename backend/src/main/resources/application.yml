spring:
  application:
    name: stella-atlas-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/stella_atlas}
    username: ${SPRING_DATASOURCE_USERNAME:stella_atlas}
    password: ${SPRING_DATASOURCE_PASSWORD:stella_atlas}
    hikari:
      connection-timeout: 3000
      validation-timeout: 1000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

server:
  error:
    include-exception: false
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
