spring:
  application:
    name: stella-atlas-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/stella_atlas}
    username: ${SPRING_DATASOURCE_USERNAME:stella_atlas}
    password: ${SPRING_DATASOURCE_PASSWORD:stella_atlas}
    hikari:
      connection-timeout: 3000
      validation-timeout: 1000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

server:
  error:
    include-exception: false
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

stellaatlas:
  weather:
    open-meteo:
      base-url: ${WEATHER_API_BASE_URL:https://api.open-meteo.com}
      connect-timeout: ${WEATHER_API_CONNECT_TIMEOUT:2s}
      read-timeout: ${WEATHER_API_READ_TIMEOUT:5s}
    cache:
      ttl: ${WEATHER_CACHE_TTL:15m}
      maximum-size: ${WEATHER_CACHE_MAXIMUM_SIZE:1000}
